name: Update Sleeper dashboard
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - update.py
  schedule:
    # Hourly at :17 UTC during NFL season (September through January).
    # GitHub scheduled runs are best-effort and may be delayed.
    - cron: '17 * * 9-12,1 *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch Sleeper snapshot
        run: python update.py
      - name: Save latest snapshot to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Sleeper roster snapshot"
            git push
          else
            echo "No snapshot changes to commit"
          fi
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
