<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Going Concern | Sleeper</title><style>body{font:16px system-ui,sans-serif;background:#f4f6fa;color:#172237;max-width:1000px;margin:28px auto;padding:0 18px}h1{margin-bottom:4px}.muted{color:#627088}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:12px;margin:18px 0}section,.card{background:white;padding:18px;border-radius:12px;box-shadow:0 1px 5px #15203016;margin-bottom:15px}.value{font-size:28px;font-weight:700}table{border-collapse:collapse;width:100%}td,th{padding:8px;border-bottom:1px solid #e4e8ef;text-align:left}th{font-size:12px}input{width:95%;padding:10px;margin:8px 0}</style></head><body><h1>Going Concern</h1><p class="muted">Sleeper league dashboard · Automatically updated snapshot</p><p id="time">Loading...</p><div class="grid" id="cards"></div><section><h2>Starters</h2><div id="starters"></div></section><section><h2>Bench and reserves</h2><div id="bench"></div></section><section><h2>Unrostered player search</h2><p class="muted">Unrostered does not guarantee immediately claimable.</p><input id="search" placeholder="Search name, team, or position"><p id="count"></p><div id="free"></div></section><section><h2>This week's transactions</h2><div id="tx"></div></section><p><a href="data.json">Full JSON snapshot for ChatGPT</a></p><script>
const el=id=>document.getElementById(id);const safe=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function table(a){return a.length?'<table><tr><th>Player</th><th>Position</th><th>NFL team</th><th>Status</th></tr>'+a.map(p=>`<tr><td>${safe(p.name)}</td><td>${safe(p.position)}</td><td>${safe(p.team)}</td><td>${safe(p.status)}</td></tr>`).join('')+'</table>':'<p class="muted">None</p>'}
let data;function filter(){let q=el('search').value.toLowerCase();let a=data.free_agents.filter(p=>(p.name+' '+p.position+' '+p.team).toLowerCase().includes(q));el('count').textContent=`${a.length} matches; displaying first 100`;el('free').innerHTML=table(a.slice(0,100))}
fetch('data.json?v='+Date.now()).then(r=>{if(!r.ok)throw Error('No data snapshot published');return r.json()}).then(d=>{data=d;let s=d.team.settings||{};el('time').textContent='Last updated '+new Date(d.updated_at_utc).toLocaleString()+' · NFL week '+d.week;let c=[['Record',(s.wins??'?')+'–'+(s.losses??'?')],['Waiver position',s.waiver_position??'Unknown'],['Roster ID',d.team.roster_id],['Total players',d.team.all_players.length]];el('cards').innerHTML=c.map(([k,v])=>`<div class="card"><div class="value">${safe(v)}</div><small>${safe(k)}</small></div>`).join('');el('starters').innerHTML=table(d.team.starters);el('bench').innerHTML=table([...d.team.bench,...d.team.reserve,...d.team.taxi]);el('tx').innerHTML=d.recent_team_transactions.length?d.recent_team_transactions.map(t=>`<p>${safe(t.type)} (${safe(t.status)}): Added ${t.adds.map(p=>safe(p.name)).join(', ')||'none'}; dropped ${t.drops.map(p=>safe(p.name)).join(', ')||'none'}</p>`).join(''):'<p class="muted">No transactions returned for your team this week.</p>';filter();el('search').oninput=filter}).catch(e=>el('time').textContent='Cannot load dashboard: '+e.message)
</script></body></html>
